<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Helvetica,Arial,sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66707d"></path></marker></defs><text x="20" y="22" font-size="11" fill="#66707d" text-anchor="start" font-weight="600">After the redesign</text><rect x="20" y="160" width="170" height="74" rx="8" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"></rect><text x="36" y="188" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Payment gateway</text><text x="36" y="208" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">the only source of truth</text><rect x="250" y="160" width="200" height="74" rx="8" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"></rect><text x="266" y="188" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Reconciliation engine</text><text x="266" y="208" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">rules every 15 minutes</text><line x1="190" y1="197" x2="246" y2="197" stroke="#66707d" stroke-width="1.6" marker-end="url(#head)"></line><rect x="510" y="40" width="370" height="96" rx="8" fill="#f4faf7" stroke="#1c7c54" stroke-width="1.2"></rect><text x="526" y="68" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Fast lane, no human</text><text x="526" y="88" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">same batch, identity matched, seat free</text><text x="526" y="106" font-size="10.5" fill="#1c7c54" text-anchor="start" font-weight="400">66.7% of paid renewals: booking plus 24 sessions</text><rect x="510" y="280" width="370" height="96" rx="8" fill="#fdf8f1" stroke="#a8641a" stroke-width="1.2"></rect><text x="526" y="308" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Exception lane, one owner</text><text x="526" y="328" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">full batch, part payment, payer mismatch, batch change</text><text x="526" y="346" font-size="10.5" fill="#a8641a" text-anchor="start" font-weight="400">33.3% of paid renewals: owner, SLA, drafted message</text><path d="M450,180 C480,180 480,100 506,98" fill="none" stroke="#1c7c54" stroke-width="1.6" marker-end="url(#head)"></path><path d="M450,214 C480,214 480,320 506,322" fill="none" stroke="#a8641a" stroke-width="1.6" marker-end="url(#head)"></path><rect x="250" y="300" width="200" height="64" rx="8" fill="#fbfcfd" stroke="#dfe4ea" stroke-width="1.2"></rect><text x="266" y="328" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Teacher form</text><text x="266" y="348" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">optional corroboration, never the trigger</text><line x1="350" y1="300" x2="350" y2="238" stroke="#66707d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#head)"></line><text x="360" y="272" font-size="10" fill="#66707d" text-anchor="start" font-weight="400">dashed: no longer gates anything</text></svg>