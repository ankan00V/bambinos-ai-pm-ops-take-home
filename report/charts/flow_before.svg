<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Helvetica,Arial,sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66707d"></path></marker></defs><rect x="40" y="34" width="260" height="64" rx="8" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"></rect><text x="56" y="62" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Invoice paid</text><text x="56" y="82" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">Parent, through the gateway</text><rect x="40" y="140" width="260" height="64" rx="8" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"></rect><text x="56" y="168" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Renewal form filled</text><text x="56" y="188" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">Teacher, by hand, copying the invoice</text><rect x="40" y="246" width="260" height="64" rx="8" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"></rect><text x="56" y="274" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Approved and booked</text><text x="56" y="294" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">Ops team, checking the payment</text><rect x="40" y="352" width="260" height="64" rx="8" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"></rect><text x="56" y="380" font-size="13" fill="#15191f" text-anchor="start" font-weight="600">Batch allocated</text><text x="56" y="400" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">Parent or Ops picks a slot</text><line x1="170" y1="98" x2="170" y2="138" stroke="#66707d" stroke-width="1.6" marker-end="url(#head)"></line><line x1="170" y1="204" x2="170" y2="244" stroke="#66707d" stroke-width="1.6" marker-end="url(#head)"></line><line x1="170" y1="310" x2="170" y2="350" stroke="#66707d" stroke-width="1.6" marker-end="url(#head)"></line><rect x="330" y="98" width="6" height="34" rx="3" fill="#a33131"></rect><text x="348" y="112" font-size="11.5" fill="#a33131" text-anchor="start" font-weight="600">2 of 12 paid invoices never got a form</text><text x="348" y="129" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">INR 29,000 waiting on a teacher's admin</text><rect x="330" y="204" width="6" height="34" rx="3" fill="#a33131"></rect><text x="348" y="218" font-size="11.5" fill="#a33131" text-anchor="start" font-weight="600">8 of 12 forms unapproved at the snapshot</text><text x="348" y="235" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">median 1.5h once picked up, oldest 32.5h</text><rect x="330" y="310" width="6" height="34" rx="3" fill="#a33131"></rect><text x="348" y="324" font-size="11.5" fill="#a33131" text-anchor="start" font-weight="600">2 of 4 bookings never produced a session</text><text x="348" y="341" font-size="10.5" fill="#66707d" text-anchor="start" font-weight="400">INR 21,500 paid, no class on the calendar</text><text x="40" y="22" font-size="11" fill="#66707d" text-anchor="start" font-weight="600">As it runs today</text></svg>